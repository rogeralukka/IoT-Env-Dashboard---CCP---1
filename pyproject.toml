[project]
name = "iot-env-dashboard"
version = "1.0.0"
description = "IoT Environmental Dashboard Virtual AWS Architecture"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0"
]

[tool.pytest.ini_options]
testpaths = ["iot-env-dashboard/tests"]
pythonpath = ["iot-env-dashboard"]
